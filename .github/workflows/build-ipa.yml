name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-iphone:
    name: Build unsigned iPhone application
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Record source revision and app version
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Add :PocketScanBuildSHA string ${GITHUB_SHA}" PocketScan/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.2" PocketScan/Info.plist

      - name: Build iOS application without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project PocketScan.xcodeproj \
            -scheme PocketScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ runner.temp }}/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R "${{ runner.temp }}/derived/Build/Products/Release-iphoneos/PocketScan.app" Payload/
          zip -qr PocketScan-unsigned.ipa Payload
          unzip -t PocketScan-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketScan-unsigned-IPA
          path: PocketScan-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
