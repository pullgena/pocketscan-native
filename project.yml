name: PocketScan
options:
  bundleIdPrefix: app.pocketscan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PocketScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PocketScan
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pocketscan.personal
        INFOPLIST_FILE: PocketScan/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
